apiVersion: v1
kind: Secret
metadata:
  name: okoscope-application-credentials
type: Opaque
stringData:
  payment-api: "oko_app_v1_BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc"
