openapi: 3.1.0
info:
  title: Okoscope Web API
  version: 1.0.0
  description: Stable API contract for the separately deployed Okoscope Web UI. Timestamps are RFC 3339 UTC values.
servers:
  - url: /
security:
  - sessionAuth: []
paths:
  /api/v1/runtime-groups/{group_id}/snapshots:
    get:
      operationId: listRuntimeHistorySnapshots
      summary: List compacted daily group history
      description: Whole UTC day history; day_from is inclusive and day_to exclusive. Sub-day timestamps are rejected. Snapshots contain counts only and cannot reconstruct events.
      parameters:
        - { name: group_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: day_from, in: query, schema: { type: string, format: date } }
        - { name: day_to, in: query, schema: { type: string, format: date } }
        - { name: release_id, in: query, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Daily snapshots, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeHistorySnapshotPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/organizations/{organization_id}/runtime-retention:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      operationId: getOrganizationRuntimeRetention
      description: Read effective retention settings.
      responses:
        '200':
          {
            description: Retention settings,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/RuntimeRetentionPolicy' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    put:
      operationId: putOrganizationRuntimeRetention
      description: Organization owner required. Changes affect subsequent maintenance batches.
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/RuntimeRetentionPolicy' } } }
      responses:
        '200':
          {
            description: Retention settings,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/RuntimeRetentionPolicy' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{project_id}/runtime-retention:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      operationId: getProjectRuntimeRetention
      description: Read effective retention settings.
      responses:
        '200':
          {
            description: Retention settings,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ProjectRuntimeRetention' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    put:
      operationId: putProjectRuntimeRetention
      description: Organization owner required. Changes affect subsequent maintenance batches.
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/RuntimeRetentionPolicy' } } }
      responses:
        '200':
          {
            description: Retention settings,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ProjectRuntimeRetention' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteProjectRuntimeRetention
      description: Organization owner required. Changes affect subsequent maintenance batches.
      responses:
        '200':
          {
            description: Retention settings,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ProjectRuntimeRetention' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/organizations/{organization_id}/notification-retention:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      operationId: getOrganizationNotificationRetention
      description: Read effective retention settings.
      responses:
        '200':
          {
            description: Retention settings,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/NotificationRetentionPolicy' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    put:
      operationId: putOrganizationNotificationRetention
      description: Organization owner required. Changes affect subsequent maintenance batches.
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/NotificationRetentionPolicy' } },
          }
      responses:
        '200':
          {
            description: Retention settings,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/NotificationRetentionPolicy' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{project_id}/notification-retention:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      operationId: getProjectNotificationRetention
      description: Read effective retention settings.
      responses:
        '200':
          {
            description: Retention settings,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ProjectNotificationRetention' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    put:
      operationId: putProjectNotificationRetention
      description: Organization owner required. Changes affect subsequent maintenance batches.
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/NotificationRetentionPolicy' } },
          }
      responses:
        '200':
          {
            description: Retention settings,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ProjectNotificationRetention' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteProjectNotificationRetention
      description: Organization owner required. Changes affect subsequent maintenance batches.
      responses:
        '200':
          {
            description: Retention settings,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ProjectNotificationRetention' } },
              },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/build-info:
    get:
      operationId: getBuildInfo
      security: []
      responses: { '200': { $ref: '#/components/responses/BuildInfoResponse' } }
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      security: []
      responses:
        '200': { description: Bounded setup state, content: { application/json: { schema: { $ref: '#/components/schemas/SetupStatus' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/setup/complete:
    post:
      operationId: completeSetup
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompleteSetupRequest' } } } }
      responses:
        '201': { description: First owner, Organization, Project and session created, content: { application/json: { schema: { $ref: '#/components/schemas/CompleteSetupResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/agent-installation-metadata:
    get:
      operationId: getAgentInstallationMetadata
      responses:
        '200': { description: Server-owned agent chart contract, content: { application/json: { schema: { $ref: '#/components/schemas/AgentInstallationMetadata' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{project_id}/applications/{application_id}/installations:
    parameters:
      - { name: project_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: application_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listApplicationInstallations
      responses: { '200': { description: Installation intent, content: { application/json: { schema: { $ref: '#/components/schemas/InstallationPage' } } } }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
    post:
      operationId: createApplicationInstallation
      parameters: [{ $ref: '#/components/parameters/ProvisioningIdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateInstallationRequest' } } } }
      responses: { '201': { description: Installation and one-time credential, content: { application/json: { schema: { $ref: '#/components/schemas/IssuedInstallation' } } } }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /api/v1/projects/{project_id}/applications/{application_id}/installations/{installation_id}:
    parameters:
      - { name: project_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: application_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: installation_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getApplicationInstallation
      responses: { '200': { description: Installation intent, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationInstallation' } } } }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      operationId: updateApplicationInstallation
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateInstallationRequest' } } } }
      responses: { '200': { description: Updated non-secret installation intent, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationInstallation' } } } }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/projects/{project_id}/applications/{application_id}/installations/{installation_id}/replace-credential:
    post:
      operationId: replaceInstallationCredential
      parameters:
        - { name: project_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: application_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: installation_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: One-time replacement credential, content: { application/json: { schema: { $ref: '#/components/schemas/IssuedInstallationCredential' } } } }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/projects/{project_id}/applications/{application_id}/connection-readiness:
    get:
      operationId: getApplicationConnectionReadiness
      parameters:
        - { name: project_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: application_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Bounded readiness snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionReadiness' } } } }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/auth/register:
    post:
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedSecurityAction' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/auth/login:
    post:
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AuthResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/auth/email-verification-requests:
    post:
      operationId: requestEmailVerification
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailSecurityRequest' } } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedSecurityAction' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/auth/email-verifications:
    post:
      operationId: confirmEmailVerification
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailActionRequest' } } }
      responses:
        '204': { description: Email verified; the user must sign in }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/auth/password-reset-requests:
    post:
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmailSecurityRequest' } } }
      responses:
        '202': { $ref: '#/components/responses/AcceptedSecurityAction' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/auth/password-resets:
    post:
      operationId: completePasswordReset
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } }
      responses:
        '204': { description: Password changed and all sessions revoked; the user must sign in }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/auth/password:
    put:
      operationId: changePassword
      description: Requires a trusted Origin. Rotates the current session and revokes every other session.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChangeRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AuthResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/auth/preferences:
    put:
      operationId: updateUserPreferences
      description: Requires a trusted Origin.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserPreferencesRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AuthResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      responses:
        '200': { $ref: '#/components/responses/AuthResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      responses:
        '204': { description: Session revoked and cookie expired }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/organizations:
    post:
      operationId: createOrganization
      security: [{ adminAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProvisioningIdempotencyKey' }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/CreateNamedResource' } } }
      responses:
        '201':
          {
            description: Organization created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/Organization' } } },
          }
        '200':
          {
            description: Original Organization returned for an idempotent replay,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/Organization' } } },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/admin/organizations:
    get:
      operationId: listAdminOrganizations
      security: [{ adminAuth: [] }]
      responses:
        '200':
          {
            description: Organizations ordered by creation time and id,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/AdminOrganizationPage' } },
              },
          }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/admin/organizations/{organization_id}/projects:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      operationId: listAdminProjects
      security: [{ adminAuth: [] }]
      responses:
        '200':
          {
            description: Projects ordered by creation time and id,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AdminProjectPage' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/admin/projects/{project_id}/applications:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      operationId: listAdminApplications
      security: [{ adminAuth: [] }]
      responses:
        '200':
          {
            description: Applications ordered by creation time and id,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/AdminApplicationPage' } },
              },
          }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/admin/projects/{project_id}/applications/{application_id}:
    parameters:
      [
        { $ref: '#/components/parameters/ProjectId' },
        { $ref: '#/components/parameters/ApplicationId' },
      ]
    get:
      operationId: getAdminApplication
      security: [{ adminAuth: [] }]
      responses:
        '200':
          {
            description: Application metadata without credentials,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ProvisionedApplication' } },
              },
          }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/organizations/{organization_id}/projects:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    post:
      operationId: createProject
      security: [{ sessionAuth: [] }, { adminAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProvisioningIdempotencyKey' }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/CreateNamedResource' } } }
      responses:
        '201':
          {
            description: Project created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ProvisionedProject' } } },
          }
        '200':
          {
            description: Original Project returned for an idempotent replay,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ProvisionedProject' } } },
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/attention-summary:
    get:
      operationId: getOrganizationAttentionSummary
      description: Returns a bounded, repeatable-read organization triage snapshot. Totals cover the complete tenant-scoped database set; disappeared means no longer observed and is not a security or deletion claim.
      parameters:
        - { name: window, in: query, schema: { $ref: '#/components/schemas/AttentionWindowKind' } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
        - {
            name: changed_application_limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 10, default: 5 },
          }
        - {
            name: recommendation_limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 10, default: 5 },
          }
      responses:
        '200': { $ref: '#/components/responses/OrganizationAttentionSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{project_id}/applications/{application_id}/attention-summary:
    parameters:
      [
        { $ref: '#/components/parameters/ProjectId' },
        { $ref: '#/components/parameters/ApplicationId' },
      ]
    get:
      operationId: getApplicationAttentionSummary
      description: Returns a bounded Application investigation snapshot using the latest comparable release and complete discovery totals.
      parameters:
