components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: okoscope_session
      description: Opaque HttpOnly browser session; clients send requests with credentials enabled.
    adminAuth: { type: http, scheme: bearer, description: System administrator credential }
  parameters:
    Cursor:
      {
        name: cursor,
        in: query,
        schema: { type: string, format: uuid },
        description: Opaque cursor scoped to the authenticated collection.,
      }
    OpaqueCursor:
      {
        name: cursor,
        in: query,
        schema: { type: string },
        description: Opaque cursor scoped to the authenticated collection; clients must not parse it.,
      }
    Limit:
      { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    ProjectId:
      { name: project_id, in: path, required: true, schema: { type: string, format: uuid } }
    OrganizationId:
      { name: organization_id, in: path, required: true, schema: { type: string, format: uuid } }
    ApplicationId:
      { name: application_id, in: path, required: true, schema: { type: string, format: uuid } }
    CredentialId:
      { name: credential_id, in: path, required: true, schema: { type: string, format: uuid } }
    InventoryItemId:
      { name: item_id, in: path, required: true, schema: { type: string, format: uuid } }
    PolicyId: { name: policy_id, in: path, required: true, schema: { type: string, format: uuid } }
    GroupId: { name: group_id, in: path, required: true, schema: { type: string, format: uuid } }
    ReleaseId:
      { name: release_id, in: path, required: true, schema: { type: string, format: uuid } }
    TargetId: { name: target_id, in: path, required: true, schema: { type: string, format: uuid } }
    DestinationId:
      { name: destination_id, in: path, required: true, schema: { type: string, format: uuid } }
    DeliveryId:
      { name: delivery_id, in: path, required: true, schema: { type: string, format: uuid } }
    OperationId:
      { name: operation_id, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, minLength: 8, maxLength: 200, pattern: '^[!-~]+$' },
      }
    ProvisioningIdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: false,
        description: Canonical UUID. Reusing it with a different request returns idempotency_key_reused. Application and credential replays never return plaintext token material.,
        schema: { type: string, format: uuid },
      }
  headers:
    RequestId: { schema: { type: string }, description: Correlation identifier for the request. }
  schemas:
    SetupStatus:
      type: object
      additionalProperties: false
      required: [state]
      properties: { state: { enum: [owner_required, ready, setup_unavailable] } }
    CompleteSetupRequest:
      type: object
      additionalProperties: false
      required: [setup_token, email, password, organization_slug, organization_name, project_slug, project_name]
      properties:
        setup_token: { type: string, minLength: 32, writeOnly: true }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }
        organization_slug: { type: string, minLength: 1, maxLength: 63 }
        organization_name: { type: string, minLength: 1, maxLength: 120 }
        project_slug: { type: string, minLength: 1, maxLength: 63 }
        project_name: { type: string, minLength: 1, maxLength: 120 }
    CompleteSetupResponse:
      type: object
      additionalProperties: false
      required: [user_id, organization_id, project_id, role]
      properties:
        user_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
