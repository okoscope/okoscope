        id: { $ref: '#/components/schemas/Uuid' }
        organization_id: { $ref: '#/components/schemas/Uuid' }
        project_id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        name: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    AdminApplicationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          {
            type: array,
            maxItems: 200,
            items: { $ref: '#/components/schemas/ProvisionedApplication' },
          }
    ApplicationCredential:
      type: object
      additionalProperties: false
      required: [id, name, token_hint, created_at, last_used_at, revoked_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 64,
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$',
          }
        token_hint: { type: string, minLength: 4, maxLength: 12 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        last_used_at:
          allOf: [{ $ref: '#/components/schemas/NullableTimestamp' }]
          description: Time of the most recent successful agent authentication; failed attempts do not update it.
        revoked_at: { $ref: '#/components/schemas/NullableTimestamp' }
    ApplicationCredentialPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          {
            type: array,
            maxItems: 200,
            items: { $ref: '#/components/schemas/ApplicationCredential' },
          }
    IssueCredentialRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        {
          name:
            {
              type: string,
              minLength: 1,
              maxLength: 64,
              pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$',
            },
        }
    IssuedApplicationCredential:
      type: object
      additionalProperties: false
      required: [id, name, token, token_hint, created_at, shown_once]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        token: { type: string, writeOnly: true, pattern: '^oko_app_v1_[A-Za-z0-9_-]+$' }
        token_hint: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        shown_once: { type: boolean, const: true }
    CreatedApplication:
      type: object
      additionalProperties: false
      required: [application, credential]
      properties:
        application: { $ref: '#/components/schemas/ProvisionedApplication' }
        credential: { $ref: '#/components/schemas/IssuedApplicationCredential' }
    Project:
      type: object
      additionalProperties: false
      required: [id, slug, name, created_at, archived_at, application_count, runtime_group_count]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        name: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        archived_at: { $ref: '#/components/schemas/NullableTimestamp' }
        application_count: { type: integer, format: int64, minimum: 0 }
        runtime_group_count: { type: integer, format: int64, minimum: 0 }
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Project' } }
        next_cursor: { $ref: '#/components/schemas/NullableUuid' }
    Application:
      type: object
      additionalProperties: false
      required:
        [
          id,
          project_id,
          slug,
          name,
          created_at,
          release_count,
          runtime_group_count,
          latest_observed_at,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        project_id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        name: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        release_count: { type: integer, format: int64, minimum: 0 }
        runtime_group_count: { type: integer, format: int64, minimum: 0 }
        latest_observed_at: { $ref: '#/components/schemas/NullableTimestamp' }
    ApplicationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Application' } }
        next_cursor: { $ref: '#/components/schemas/NullableUuid' }
    ApplicationWorker:
      type: object
      additionalProperties: false
      required:
        [
          agent_id,
          cluster_id,
          cluster_name,
          node_name,
          agent_version,
          architecture,
          kernel_release,
          first_observed_at,
          last_observed_at,
          agent_last_seen_at,
        ]
      properties:
        agent_id: { $ref: '#/components/schemas/Uuid' }
        cluster_id: { $ref: '#/components/schemas/Uuid' }
        cluster_name: { type: string, minLength: 1, maxLength: 200 }
        node_name: { type: string, minLength: 1, maxLength: 253 }
        agent_version: { type: string, minLength: 1, maxLength: 200 }
        architecture: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        kernel_release: { type: [string, 'null'], minLength: 1, maxLength: 255 }
        first_observed_at: { $ref: '#/components/schemas/Timestamp' }
        last_observed_at: { $ref: '#/components/schemas/Timestamp' }
        agent_last_seen_at: { $ref: '#/components/schemas/Timestamp' }
    ApplicationWorkerPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, coverage]
      properties:
        coverage: { $ref: '#/components/schemas/RuntimeRetentionCoverage' }
        items:
          { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ApplicationWorker' } }
        next_cursor: { $ref: '#/components/schemas/NullableOpaqueCursor' }
    RuntimeGroup:
      type: object
      additionalProperties: false
      required:
        [
          coverage,
          id,
          project_id,
          application_id,
          cluster_id,
          namespace,
          workload_kind,
          workload_name,
          fingerprint_version,
          event_kind,
          semantic_summary,
          status,
          first_seen_at,
          first_seen_event_id,
          last_seen_at,
          occurrence_count,
          representative_event_id,
          status_changed_at,
          status_changed_by,
          policy_evaluation,
          active_suppression,
          actionable,
        ]
      properties:
        coverage: { $ref: '#/components/schemas/RuntimeRetentionCoverage' }
        id: { $ref: '#/components/schemas/Uuid' }
        project_id: { $ref: '#/components/schemas/Uuid' }
        application_id: { $ref: '#/components/schemas/Uuid' }
        cluster_id: { $ref: '#/components/schemas/Uuid' }
        namespace: { type: string }
        workload_kind: { type: string }
        workload_name: { type: string }
        fingerprint_version: { type: integer }
        event_kind: { type: string }
        semantic_summary: { $ref: '#/components/schemas/RuntimeEventSemanticSummary' }
        status: { type: string, enum: [open, acknowledged, resolved] }
        first_seen_at: { $ref: '#/components/schemas/Timestamp' }
        first_seen_event_id: { $ref: '#/components/schemas/NullableUuid' }
        last_seen_at: { $ref: '#/components/schemas/Timestamp' }
        occurrence_count: { type: integer, format: int64, minimum: 0 }
        representative_event_id: { $ref: '#/components/schemas/NullableUuid' }
        policy_evaluation: { $ref: '#/components/schemas/PolicyEvaluation' }
        active_suppression:
          { anyOf: [{ $ref: '#/components/schemas/ActivePolicySuppression' }, { type: 'null' }] }
        actionable: { type: boolean }
        status_changed_at: { $ref: '#/components/schemas/NullableTimestamp' }
        status_changed_by: { $ref: '#/components/schemas/NullableUuid' }
    PolicyEvaluation:
      type: object
      additionalProperties: false
      required: [state, verdict, reason_code, explanation]
      properties:
        state: { $ref: '#/components/schemas/PolicyEvaluationState' }
        verdict: { anyOf: [{ $ref: '#/components/schemas/PolicyVerdict' }, { type: 'null' }] }
        reason_code:
          {
            type: string,
            enum:
              [
                no_matching_policy,
                inside_placement,
                outside_placement,
                equal_specificity_conflict,
                evaluation_pending,
              ],
          }
        winning_revision_id: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        explanation:
          {
            type: object,
            additionalProperties: false,
            properties:
              {
                specificity: { type: array, maxItems: 4, items: { type: integer } },
                related_revision_ids:
                  { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Uuid' } },
              },
          }
        evaluated_at: { anyOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
    ActivePolicySuppression:
      {
        type: object,
        additionalProperties: false,
        required: [id, reason, expires_at, created_at],
        properties:
          {
            id: { $ref: '#/components/schemas/Uuid' },
            reason: { type: string },
            expires_at: { $ref: '#/components/schemas/Timestamp' },
            created_at: { $ref: '#/components/schemas/Timestamp' },
          },
      }
    RuntimeGroupPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RuntimeGroup' } }
        next_cursor: { $ref: '#/components/schemas/NullableUuid' }
    EventOccurrence:
      type: object
      additionalProperties: false
      required:
        [
          id,
          event_id,
          observed_at,
          received_at,
          node_name,
          namespace,
          pod_name,
          container_name,
          process_command,
          event_kind,
          payload,
          correlation,
          related_evidence,
          release_id,
          release_version,
          release_display_name,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        event_id: { $ref: '#/components/schemas/Uuid' }
        observed_at: { $ref: '#/components/schemas/Timestamp' }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        node_name: { type: string }
        namespace: { type: string }
        pod_name: { type: string }
        container_name: { type: string }
        process_command: { type: string }
        event_kind: { type: string }
        payload: { $ref: '#/components/schemas/RuntimeEventPayload' }
        correlation: { $ref: '#/components/schemas/EventCorrelation' }
        related_evidence:
          { type: array, maxItems: 20, items: { $ref: '#/components/schemas/RelatedEvidence' } }
        release_id: { $ref: '#/components/schemas/NullableUuid' }
        release_version: { type: [string, 'null'] }
        release_display_name: { type: string, minLength: 1 }
    OccurrencePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, ordering]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EventOccurrence' } }
        next_cursor: { $ref: '#/components/schemas/NullableUuid' }
        ordering: { type: string, const: received_at_desc_observed_at_desc_id_desc }
    RelatedEvidence:
      type: object
      additionalProperties: false
      required: [id, event_id, observed_at, received_at, event_kind, source, payload]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        event_id: { $ref: '#/components/schemas/Uuid' }
        observed_at: { $ref: '#/components/schemas/Timestamp' }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        event_kind: { type: string }
        source: { type: string, enum: [kernel, kubernetes, derived, unknown] }
        payload: { $ref: '#/components/schemas/RuntimeEventPayload' }
    RuntimeEventSemanticSummary:
      oneOf:
        - { $ref: '#/components/schemas/ProcessExecSemanticSummary' }
        - { $ref: '#/components/schemas/SyscallSemanticSummary' }
        - { $ref: '#/components/schemas/NetworkConnectSemanticSummary' }
        - { $ref: '#/components/schemas/InboundNetworkSemanticSummary' }
        - { $ref: '#/components/schemas/NetworkDnsQuerySemanticSummary' }
        - { $ref: '#/components/schemas/NetworkDnsResponseSemanticSummary' }
        - { $ref: '#/components/schemas/FileActivitySemanticSummary' }
        - { $ref: '#/components/schemas/ProcessExitSemanticSummary' }
        - { $ref: '#/components/schemas/ContainerTerminationSemanticSummary' }
        - { $ref: '#/components/schemas/ContainerRestartSemanticSummary' }
        - { $ref: '#/components/schemas/RestartLoopSemanticSummary' }
    ProcessExecSemanticSummary:
      type: object
      additionalProperties: false
      required: [executable]
      properties:
        executable: { type: string, minLength: 1 }
    SyscallSemanticSummary:
      type: object
      additionalProperties: false
      required: [process_command, syscall]
      properties:
        process_command: { type: string, minLength: 1 }
        syscall: { type: string, minLength: 1 }
    NetworkConnectSemanticSummary:
      type: object
      additionalProperties: false
      required: [process_command, address_family, destination_address, destination_port]
      properties:
        process_command: { type: string, minLength: 1, example: curl }
        address_family: { type: string, enum: [ipv4, ipv6] }
        destination_address: { type: string, format: ip, example: 203.0.113.7 }
        destination_port: { type: integer, minimum: 1, maximum: 65535, example: 443 }
        dns_context: { $ref: '#/components/schemas/DnsContext' }
    InboundNetworkSemanticSummary:
      type: object
      additionalProperties: false
      required: [process_command, transport, address_family, local_address, local_port]
      properties:
        process_command: { type: string, minLength: 1, example: payments }
        transport: { type: string, const: tcp }
        address_family: { type: string, enum: [ipv4, ipv6] }
        local_address: { type: string, format: ip, example: 0.0.0.0 }
        local_port: { type: integer, minimum: 1, maximum: 65535, example: 8080 }
    NetworkDnsQuerySemanticSummary:
      type: object
      additionalProperties: false
      required: [process_command, name, query_type, transport, direction]
      properties:
        process_command: { type: string, minLength: 1 }
        name: { $ref: '#/components/schemas/DnsName' }
        query_type: { $ref: '#/components/schemas/DnsQueryType' }
        transport: { $ref: '#/components/schemas/DnsTransport' }
        direction: { $ref: '#/components/schemas/DnsDirection' }
    NetworkDnsResponseSemanticSummary:
      type: object
      additionalProperties: false
      required: [process_command, name, query_type, response_code, transport, direction]
      properties:
        process_command: { type: string, minLength: 1 }
        name: { $ref: '#/components/schemas/DnsName' }
        query_type: { $ref: '#/components/schemas/DnsQueryType' }
        response_code: { $ref: '#/components/schemas/DnsResponseCode' }
        transport: { $ref: '#/components/schemas/DnsTransport' }
        direction: { $ref: '#/components/schemas/DnsDirection' }
    FileActivitySemanticSummary:
      type: object
      additionalProperties: false
      required: [operation, process_command, path]
      properties:
        operation: { $ref: '#/components/schemas/FileActivityOperation' }
        process_command: { type: string, minLength: 1 }
        path: { type: string, minLength: 1, description: Path reported by the process syscall. }
        new_path:
          {
            type: string,
            minLength: 1,
            description: Rename destination path reported by the process syscall.,
          }
        replaced:
          {
            type: [boolean, 'null'],
            description: Whether rename replaced an existing destination; null means unknown.,
          }
    FileActivityOperation: { type: string, enum: [create, modify, delete, rename] }
    RuntimeEventKind:
      type: string
      enum:
        [
          process.exec,
          syscall,
          network.connect,
          network.listen,
          network.accept,
          network.dns_query,
          network.dns_response,
          file.create,
          file.modify,
          file.delete,
          file.rename,
          process.exit,
          container.terminated,
          container.restart,
          container.restart_loop,
        ]
    EvidenceSource: { type: string, enum: [kernel, kubernetes, derived] }
    EventCorrelation:
      type: object
      additionalProperties: false
      required: [status, candidate_count, related_event_ids]
      properties:
        retention_incomplete:
          { type: boolean, description: A related raw event was removed by retention. }
        status: { type: string, enum: [absent, qualified, ambiguous] }
        candidate_count: { type: integer, minimum: 0, maximum: 2 }
        tolerance_seconds: { type: integer, minimum: 1 }
        related_event_ids:
          { type: array, maxItems: 1, items: { $ref: '#/components/schemas/Uuid' } }
    ProcessTermination:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, status]
          properties:
            type: { type: string, const: exited }
            status: { type: integer, minimum: 0, maximum: 255 }
        - type: object
          additionalProperties: false
          required: [type, signal, signal_name, core_dump_flag]
          properties:
            type: { type: string, const: signaled }
            signal: { type: integer, minimum: 1, maximum: 64 }
            signal_name: { type: string, pattern: '^SIG[A-Z0-9]+$' }
            core_dump_flag:
              {
                type: boolean,
                description: Kernel wait-status flag; does not prove a core file was written.,
              }
            conventional_exit_code: { type: integer, minimum: 129, maximum: 192, readOnly: true }
    GenerationCorrelation:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status, generation, exec_event_id, executable]
          properties:
            status: { type: string, const: observed }
            generation: { type: integer, format: int64, minimum: 1 }
            exec_event_id: { $ref: '#/components/schemas/Uuid' }
            executable: { type: string, minLength: 1, maxLength: 256 }
        - type: object
          additionalProperties: false
          required: [status, reason]
          properties:
            status: { type: string, const: unresolved }
            reason:
              {
                type: string,
                enum:
                  [before_observation, evicted, generation_mismatch, container_lifetime_mismatch],
              }
    KubernetesTermination:
      type: object
      additionalProperties: false
      required: [source, runtime_container_id, reason, exit_code]
      properties:
        source: { type: string, const: kubernetes }
        runtime_container_id: { type: string, minLength: 1, maxLength: 256 }
        reason: { type: string, minLength: 1, maxLength: 256 }
        exit_code: { type: integer, minimum: 0 }
        started_at: { $ref: '#/components/schemas/NullableTimestamp' }
        finished_at: { $ref: '#/components/schemas/NullableTimestamp' }
    ProcessExitSemanticSummary:
      type: object
      additionalProperties: true
      required: [evidence_source, identity, termination]
      properties:
        event_kind: { type: string, const: process.exit }
        evidence_source: { type: string, const: kernel }
        identity: { type: string, minLength: 1 }
        termination: { $ref: '#/components/schemas/ProcessTermination' }
    ContainerTerminationSemanticSummary:
      type: object
      additionalProperties: true
      required: [evidence_source, container_name, reason, exit_code]
      properties:
        event_kind: { type: string, const: container.terminated }
        evidence_source: { type: string, const: kubernetes }
        container_name: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
        exit_code: { type: integer, minimum: 0 }
    ContainerRestartSemanticSummary:
      type: object
      additionalProperties: true
      required: [evidence_source, container_name]
      properties:
        event_kind: { type: string, const: container.restart }
        evidence_source: { type: string, const: kubernetes }
        container_name: { type: string, minLength: 1 }
    RestartLoopSemanticSummary:
      type: object
      additionalProperties: false
      required:
        [
          evidence_source,
          projection_version,
          threshold,
          window_started_at,
          window_ended_at,
          observed_restart_count,
          container_name,
        ]
      properties:
        event_kind: { type: string, const: container.restart_loop }
        evidence_source: { type: string, const: derived }
        projection_version: { type: integer, minimum: 1 }
        threshold: { type: integer, minimum: 1 }
        window_started_at: { $ref: '#/components/schemas/Timestamp' }
        window_ended_at: { $ref: '#/components/schemas/Timestamp' }
        observed_restart_count: { type: integer, minimum: 1 }
        container_name: { type: string, minLength: 1 }
        latest_termination: { $ref: '#/components/schemas/KubernetesTermination' }
        latest_waiting_reason: { type: [string, 'null'], maxLength: 256 }
    RuntimeEventPayload:
      oneOf:
        - { $ref: '#/components/schemas/ProcessExecPayload' }
        - { $ref: '#/components/schemas/SyscallPayload' }
        - { $ref: '#/components/schemas/NetworkConnectPayload' }
        - { $ref: '#/components/schemas/NetworkListenPayload' }
        - { $ref: '#/components/schemas/NetworkAcceptPayload' }
        - { $ref: '#/components/schemas/NetworkDnsQueryPayload' }
        - { $ref: '#/components/schemas/NetworkDnsResponsePayload' }
        - { $ref: '#/components/schemas/FileCreatePayload' }
        - { $ref: '#/components/schemas/FileModifyPayload' }
        - { $ref: '#/components/schemas/FileDeletePayload' }
        - { $ref: '#/components/schemas/FileRenamePayload' }
        - { $ref: '#/components/schemas/ProcessExitPayload' }
        - { $ref: '#/components/schemas/ContainerTerminationPayload' }
        - { $ref: '#/components/schemas/ContainerRestartPayload' }
        - { $ref: '#/components/schemas/ContainerRestartLoopPayload' }
    ContainerRestartLoopPayload:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: { type: string, const: ContainerRestartLoop }
        data: { $ref: '#/components/schemas/RestartLoopSemanticSummary' }
    ProcessExitPayload:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: { type: string, const: ProcessExit }
        data:
          type: object
          additionalProperties: false
          required: [source, raw_wait_status, termination, correlation]
          properties:
            source: { type: string, const: kernel }
            raw_wait_status: { type: integer, format: int32 }
            termination: { $ref: '#/components/schemas/ProcessTermination' }
            correlation: { $ref: '#/components/schemas/GenerationCorrelation' }
    ContainerTerminationPayload:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: { type: string, const: ContainerTermination }
        data: { $ref: '#/components/schemas/KubernetesTermination' }
    ContainerRestartPayload:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: { type: string, const: ContainerRestart }
        data:
          type: object
          additionalProperties: false
          required: [source, runtime_container_id, restart_count, restart_delta, observation_gap]
          properties:
            source: { type: string, const: kubernetes }
            runtime_container_id: { type: string, minLength: 1, maxLength: 256 }
            restart_count: { type: integer, minimum: 1 }
            restart_delta: { type: integer, minimum: 1 }
            observation_gap: { type: boolean }
            previous_termination: { $ref: '#/components/schemas/KubernetesTermination' }
            waiting_reason: { type: [string, 'null'], maxLength: 256 }
    ProcessExecPayload:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: { type: string, const: ProcessExec }
        data:
          type: object
          additionalProperties: false
          required: [executable, parent_command]
          properties:
            executable: { type: string, minLength: 1 }
            parent_command: { type: [string, 'null'] }
    SyscallPayload:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: { type: string, const: Syscall }
        data:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string, minLength: 1 }
    NetworkConnectPayload:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: { type: string, const: NetworkConnect }
        data:
          type: object
          additionalProperties: false
          required: [address_family, destination_address, destination_port, outcome]
          properties:
            address_family: { type: string, enum: [ipv4, ipv6] }
            destination_address: { type: string, format: ip, example: '2001:db8::7' }
            destination_port: { type: integer, minimum: 1, maximum: 65535, example: 443 }
            outcome: { type: string, enum: [succeeded, in_progress, failed] }
            errno: { type: integer, minimum: 1, maximum: 4095, example: 111 }
            dns_context: { $ref: '#/components/schemas/DnsContext' }
    NetworkListenPayload:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type: { type: string, const: NetworkListen }
        data:
          type: object
          additionalProperties: false
          required: [transport, address_family, local_address, local_port]
          properties:
            transport: { type: string, const: tcp }
            address_family: { type: string, enum: [ipv4, ipv6] }
