apiVersion: v1
kind: Namespace
metadata:
  name: okoscope-network-acceptance
---
apiVersion: batch/v1
kind: Job
metadata:
  name: selected-network-fixture
  namespace: okoscope-network-acceptance
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        okoscope.io/network-acceptance: selected
    spec:
      restartPolicy: Never
      containers:
        - name: fixture
          image: python:3.13-alpine
          command: [python, -c]
          args:
            - |
              import errno
              import socket
              import threading
              import time

              # Allow the agent's Kubernetes watch to index this new container before traffic.
              time.sleep(20)

              def listen_once(family, address):
                  server = socket.socket(family, socket.SOCK_STREAM)
                  server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  server.bind(address)
                  server.listen(4)
                  port = server.getsockname()[1]
                  def accept_and_close():
                      connection, _ = server.accept()
                      connection.close()
                      server.close()
                  thread = threading.Thread(target=accept_and_close)
                  thread.start()
                  return port, thread

              ipv4_port, ipv4_thread = listen_once(socket.AF_INET, ("127.0.0.1", 0))
              client = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              client.connect(("127.0.0.1", ipv4_port))
              client.close()
              ipv4_thread.join()

              failed = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              try:
                  failed.connect(("127.0.0.1", ipv4_port))
              except OSError:
                  pass
              failed.close()

              pending = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              pending.setblocking(False)
              result = pending.connect_ex(("198.51.100.1", 9))
              assert result in (0, errno.EINPROGRESS, errno.EWOULDBLOCK)
              pending.close()

              if socket.has_ipv6:
                  try:
                      ipv6_port, ipv6_thread = listen_once(socket.AF_INET6, ("::1", 0))
                      ipv6 = socket.socket(socket.AF_INET6, socket.SOCK_STREAM)
                      ipv6.connect(("::1", ipv6_port))
                      ipv6.close()
                      ipv6_thread.join()
                  except OSError:
                      pass

              unsupported = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              try:
                  unsupported.connect("/tmp/okoscope-missing.sock")
              except OSError:
                  pass
              unsupported.close()

              time.sleep(120)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: unselected-network-fixture
  namespace: okoscope-network-acceptance
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        okoscope.io/network-acceptance: unselected
    spec:
      restartPolicy: Never
      containers:
        - name: fixture
          image: busybox:1.37
          command: [sh, -c]
          args: ["sleep 20; wget -T 1 -q -O /dev/null http://127.0.0.1:1 || true; sleep 120"]
