name: Feature or design proposal
description: Propose a user-visible capability or material design change
title: "proposal: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and roadmap items for related proposals.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, and what outcome is currently difficult or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe behavior and success criteria, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and operational impact
      description: Consider API, protocol, migrations, security, privacy, performance, rollout, and rollback.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
