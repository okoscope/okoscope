apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "okoscope-agent.fullname" . }}
  labels:
    {{- include "okoscope-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets, deployments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "okoscope-agent.fullname" . }}
  labels:
    {{- include "okoscope-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "okoscope-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "okoscope-agent.fullname" . }}
    namespace: {{ .Release.Namespace }}
