apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "okoscope.fullname" . }}-web
  labels:
    {{- include "okoscope.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}}
  template:
    metadata: {labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}}
    spec:
      terminationGracePeriodSeconds: 15
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "okoscope.image" .Values.web.image }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: OKOSCOPE_API_BASE_URL
              value: /
            - name: OKOSCOPE_API_UPSTREAM
              value: http://{{ include "okoscope.fullname" . }}-server:8080
          resources: {{ toYaml .Values.web.resources | nindent 12 }}
          startupProbe: {httpGet: {path: /healthz, port: http}, failureThreshold: 15, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "okoscope.fullname" . }}-web
  labels:
    {{- include "okoscope.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web}
  ports: [{name: http, port: 80, targetPort: http}]
