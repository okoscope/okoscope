apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "okoscope.fullname" . }}-server
  labels:
    {{- include "okoscope.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: server}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: server}
      annotations: {checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "okoscope.image" .Values.server.image }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsUser: 65532, runAsGroup: 65532}
          envFrom: [{configMapRef: {name: {{ include "okoscope.fullname" . }}-server}}]
          env:
            - name: OKOSCOPE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: {{ .Values.database.urlKey }}}}
            - name: OKOSCOPE_ADMIN_CREDENTIAL
              valueFrom: {secretKeyRef: {name: {{ include "okoscope.internalSecret" . }}, key: {{ .Values.internalSecret.adminCredentialKey }}}}
            - name: OKOSCOPE_WEBHOOK_ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: {{ include "okoscope.internalSecret" . }}, key: {{ .Values.internalSecret.webhookEncryptionKey }}}}
            - name: OKOSCOPE_IDENTITY_TOKEN_KEY
              valueFrom: {secretKeyRef: {name: {{ include "okoscope.internalSecret" . }}, key: {{ .Values.internalSecret.identityTokenKey }}}}
            {{- if .Values.mail.enabled }}
            - name: OKOSCOPE_MAIL_ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: {{ include "okoscope.internalSecret" . }}, key: {{ .Values.internalSecret.mailEncryptionKey }}}}
            - name: OKOSCOPE_SMTP_USERNAME
              valueFrom: {secretKeyRef: {name: {{ .Values.mail.smtp.existingSecret }}, key: {{ .Values.mail.smtp.usernameKey }}}}
            - name: OKOSCOPE_SMTP_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.mail.smtp.existingSecret }}, key: {{ .Values.mail.smtp.passwordKey }}}}
            {{- end }}
            - name: OKOSCOPE_SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-setup" (include "okoscope.fullname" .)) .Values.setupAuthorization.existingSecret }}
                  key: {{ .Values.setupAuthorization.tokenKey }}
            {{- if .Values.setupAuthorization.existingSecret }}
            - name: OKOSCOPE_SETUP_TOKEN_EXPIRES_AT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.setupAuthorization.existingSecret }}
                  key: {{ .Values.setupAuthorization.expiresAtKey }}
                  optional: true
            {{- end }}
          ports: [{name: grpc, containerPort: 4317}, {name: health, containerPort: 8080}]
          resources: {{ toYaml .Values.server.resources | nindent 12 }}
          startupProbe: {httpGet: {path: /healthz, port: health}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /readyz, port: health}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: health}, periodSeconds: 10}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "okoscope.fullname" . }}-server
  labels:
    {{- include "okoscope.labels" . | nindent 4 }}
  {{- if and .Values.ingress.grpc.enabled (eq .Values.ingress.grpc.className "traefik") }}
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: h2c
  {{- end }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: server}
  ports: [{name: grpc, port: 4317, targetPort: grpc}, {name: health, port: 8080, targetPort: health}]
