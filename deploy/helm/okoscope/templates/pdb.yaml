{{- if .Values.podDisruptionBudget.enabled }}
{{- range $component := list "server" "web" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "okoscope.fullname" $ }}-{{ $component }}
  labels:
    {{- include "okoscope.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector: {matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $component }}}}
---
{{- end }}
{{- end }}
