apiVersion: v1
kind: Pod
metadata:
  name: {{ include "okoscope.fullname" . }}-test-readiness
  annotations: {helm.sh/hook: test}
  labels:
    {{- include "okoscope.labels" . | nindent 4 }}
spec:
  restartPolicy: Never
  containers:
    - name: readiness
      image: curlimages/curl:8.15.0
      command: [sh, -ec]
      args:
        - >-
          curl --fail --silent http://{{ include "okoscope.fullname" . }}-server:8080/readyz
          && curl --fail --silent http://{{ include "okoscope.fullname" . }}-server:8080/api/v1/build-info
          | grep '"required_database_migration":26'
