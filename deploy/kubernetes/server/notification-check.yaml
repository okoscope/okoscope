apiVersion: batch/v1
kind: Job
metadata:
  name: okoscope-notification-check-000000000000
  labels:
    app.kubernetes.io/name: okoscope-notification-check
  annotations:
    okoscope.io/required-migration: "__REQUIRED_MIGRATION__"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: okoscope-notification-check
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: notification-check
          image: ghcr.io/okoscope/okoscope-server:0000000000000000000000000000000000000000
          args: [notification-check]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
          envFrom:
            - configMapRef:
                name: okoscope-server-activation
          env:
            - {name: RUST_LOG, value: info}
            - name: OKOSCOPE_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: okoscope-secrets, key: database-url}
            - name: OKOSCOPE_WEBHOOK_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: {name: okoscope-secrets, key: webhook-encryption-key}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: okoscope-server-activation
data:
  OKOSCOPE_NOTIFICATION_DELIVERY_ENABLED: "__NOTIFICATION_ENABLED__"
  OKOSCOPE_NOTIFICATION_POLL_MS: "__NOTIFICATION_POLL_MS__"
  OKOSCOPE_NOTIFICATION_CLAIM_SIZE: "__NOTIFICATION_CLAIM_SIZE__"
  OKOSCOPE_NOTIFICATION_CONCURRENCY: "__NOTIFICATION_CONCURRENCY__"
  OKOSCOPE_NOTIFICATION_LEASE_SECONDS: "__NOTIFICATION_LEASE_SECONDS__"
  OKOSCOPE_WEBHOOK_TIMEOUT_SECONDS: "__WEBHOOK_TIMEOUT_SECONDS__"
  OKOSCOPE_WEBHOOK_MAX_ATTEMPTS: "__WEBHOOK_MAX_ATTEMPTS__"
  OKOSCOPE_WEBHOOK_BACKOFF_MIN_SECONDS: "__WEBHOOK_BACKOFF_MIN_SECONDS__"
  OKOSCOPE_WEBHOOK_BACKOFF_MAX_SECONDS: "__WEBHOOK_BACKOFF_MAX_SECONDS__"
  OKOSCOPE_WEBHOOK_MAX_RESPONSE_BYTES: "__WEBHOOK_MAX_RESPONSE_BYTES__"
  OKOSCOPE_NOTIFICATION_DRAIN_SECONDS: "__NOTIFICATION_DRAIN_SECONDS__"
  # Legacy policy import only; user policies are stored in PostgreSQL.
  OKOSCOPE_NOTIFICATION_RETENTION_PAUSED: "false"
  OKOSCOPE_NOTIFICATION_RETENTION_ENABLED: "__RETENTION_ENABLED__"
  OKOSCOPE_NOTIFICATION_TERMINAL_RETENTION_DAYS: "__TERMINAL_RETENTION_DAYS__"
  OKOSCOPE_NOTIFICATION_RECOVERY_RETENTION_DAYS: "__RECOVERY_RETENTION_DAYS__"
  OKOSCOPE_NOTIFICATION_RETENTION_BATCH_SIZE: "__RETENTION_BATCH_SIZE__"
  OKOSCOPE_NOTIFICATION_RETENTION_POLL_SECONDS: "__RETENTION_POLL_SECONDS__"
