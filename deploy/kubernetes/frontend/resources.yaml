apiVersion: apps/v1
kind: Deployment
metadata:
  name: okoscope-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app: okoscope-web
  template:
    metadata:
      labels:
        app: okoscope-web
        app.kubernetes.io/name: okoscope-web
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: ghcr.io/okoscope/okoscope-web:0000000000000000000000000000000000000000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 15
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: okoscope-web
spec:
  selector:
    app: okoscope-web
  ports:
    - {name: http, port: 80, targetPort: http}
