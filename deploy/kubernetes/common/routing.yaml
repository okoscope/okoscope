apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: __CERTIFICATE_NAME__
spec:
  secretName: __TLS_SECRET__
  dnsNames: [__DOMAIN__]
  issuerRef:
    kind: ClusterIssuer
    name: __CERT_ISSUER__
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: okoscope-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: okoscope-http
spec:
  entryPoints: [__HTTP_ENTRYPOINT__]
  routes:
    - match: Host(`__DOMAIN__`)
      kind: Rule
      middlewares:
        - name: okoscope-https-redirect
      services:
        - name: __WEB_SERVICE__
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: okoscope-https
spec:
  entryPoints: [__HTTPS_ENTRYPOINT__]
  routes:
    - match: Host(`__DOMAIN__`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: __SERVER_SERVICE__
          port: 8080
    - match: Host(`__DOMAIN__`)
      kind: Rule
      priority: 1
      services:
        - name: __WEB_SERVICE__
          port: 80
  tls:
    secretName: __TLS_SECRET__
