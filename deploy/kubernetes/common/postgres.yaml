apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: okoscope
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: okoscope
  annotations:
    okoscope.io/lifecycle: install-only
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17.6
          env:
            - {name: POSTGRES_USER, value: okoscope}
            - {name: POSTGRES_DB, value: okoscope}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: okoscope-secrets, key: postgres-password}
          ports:
            - {name: postgres, containerPort: 5432}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            exec: {command: [pg_isready, -U, okoscope]}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            exec: {command: [pg_isready, -U, okoscope]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, okoscope]}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: hdd.network-drives.csi.timeweb.cloud
        resources:
          requests: {storage: 2Gi}
