[workspace]
resolver = "2"
members = [
  "crates/agent",
  "crates/agent-ebpf",
  "crates/agent-ebpf-common",
  "crates/event-model",
  "crates/protocol",
  "crates/server",
]
default-members = [
  "crates/agent",
  "crates/agent-ebpf-common",
  "crates/event-model",
  "crates/protocol",
  "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/okoscope/okoscope"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
aya = "0.13"
aya-ebpf = "0.1"
aya-log = "0.2"
agent-ebpf-common = { path = "crates/agent-ebpf-common" }
bytes = "1.10"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
cookie = "0.18"
dashmap = "6.1"
event-model = { path = "crates/event-model" }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1.3"
k8s-openapi = { version = "0.26", features = ["v1_32"] }
kube = { version = "2.0", features = ["client", "runtime", "rustls-tls"] }
libc = "0.2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
prost = "0.14"
prost-build = "0.14"
protocol = { path = "crates/protocol" }
protoc-bin-vendored = "3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.14", features = ["tls-native-roots", "tls-ring"] }
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
url = "2.5"
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_raw_string_hashes = "allow"
ref_option = "allow"
manual_let_else = "allow"
